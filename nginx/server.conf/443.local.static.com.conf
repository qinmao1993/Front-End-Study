# http2 静态资源服务 curl -I --http2 https://local_static.com 验证是否开启了http2
server {
        listen       443 ssl ;
        http2        on;
        server_name  local.static.com;
        charset utf-8;
    
        ssl_certificate     /Users/qinmao/Desktop/project/Front-End-Study/nginx/secrets/cert.pem;      # 证书文件路径
        ssl_certificate_key /Users/qinmao/Desktop/project/Front-End-Study/nginx/secrets/cert-key.pem;  # 证书密钥文件路径
        
        # 只使用现代加密套件 (Mozilla 推荐)
        ssl_protocols TLSv1.2 TLSv1.3;     
        ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:AES256+EECDH:AES256+EDH:!aNULL:!MD5:!DSS:!3DES';  # 推荐的密码套件    
        ssl_prefer_server_ciphers on;       # 优先使用服务器的密码套件

        # 优化性能
        ssl_session_cache shared:SSL:10m;   # 增加缓存大小
        ssl_session_timeout 10m;            # 设置会话超时时间

        # Nginx访问日志存放位置
        access_log  /Users/qinmao/Desktop/project/Front-End-Study/nginx/logs/local.static.com/access.log custom;  
        error_log   /Users/qinmao/Desktop/project/Front-End-Study/nginx/logs/local.static.com/error.log;  

        # 注意权限问题：确保 Nginx 进程有权访问静态资源目录，通常需要将目录的权限设置为可读取的
        # sudo chown -R www-data:www-data /var/www/html  # 在 Ubuntu/Debian 上
        # sudo chown -R nginx:nginx /var/www/html        # 在 CentOS/RHEL 上
        # sudo chmod -R 755 /var/www/html                # 确保目录和文件的权限设置正确

        root  /Users/qinmao/Desktop/project/Front-End-Study/nginx/html/static;  # 设置静态资源根目录
        # index index.html index.htm;  # 默认首页文件

        location / {       
            autoindex            on;  # 开启静态资源列目录
            autoindex_exact_size off; # on(默认)显示文件的实际大小，单位是byte； off 显示文件的实际大小而不是 1K、1M 等
            autoindex_localtime  on; # off(默认)时显示的文件时间为GMT时间；on 显示的文件时间为服务器时间
            # set $limit_rate      1k;  # 限流每秒1字节，保护带宽
            try_files $uri $uri/ =404;  # 如果请求的文件不存在，返回 404 错误
        }

        # 对于 access日志界面
        location ^~ /report.html {
            access_log off;  
            try_files /Users/qinmao/Desktop/project/Front-End-Study/nginx/html/static/report.html =404;  # 确保返回该文件，如果文件不存在则返回 404
        }

        # 静态文件缓存，针对图片、CSS、JS等资源设置较长的缓存时间，提升性能
        location ~* \.(jpg|jpeg|png|gif|css|js|ico|svg|woff|woff2)$ {
            expires 30d;     # 设置静态资源的缓存时间为 30 天
            add_header Cache-Control "public, immutable";
            access_log off;   # 静态文件不记录访问日志，节省IO
        }

        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        #

        # 图片防盗链
        # location ~* \.(png|gif|jpg|jpeg)$ {
        #     valid_referers none blocked 192.168.0.2;  # 只允许本机 IP 外链引用
        #     if ($invalid_referer){
        #         return 403;
        #     }
        # }
}