# spa web
server {
	listen 8084;
	server_name localhost;
    charset utf-8;

	gzip  on; 
    gzip_comp_level    5; # 压缩级别，级别越高压缩率越大，当然压缩时间也就越长（传输快但比较消耗cpu）。默认值为 1 压缩级别取值为1-9
    gzip_min_length 1k;

    # 采用gzip压缩的文件类型(MIME类型)  默认值:text/html(默认不压缩js/css)
    # gzip_types text/csv text/xml text/css text/plain text/javascript application/javascript application/x-javascript application/json application/xml;

    # Nginx访问日志存放位置
    access_log  /Users/qinmao/Desktop/project/Front-End-Study/nginx/logs/local.spa.com/access.log custom;  
    error_log   /Users/qinmao/Desktop/project/Front-End-Study/nginx/logs/local.spa.com/error.log ;  

    location / {
        root /Users/qinmao/Desktop/project/Front-End-Study/nginx/html/spa;    # 网站根目录
        index index.html ;               # 默认首页文件
        try_files $uri $uri/ /index.html;# 按序访问，访问不到访问 /index.html
       
        expires -1;                      # 首页一般不要强制缓存   
        add_header Cache-Control no-cache;

        # deny 172.168.22.11;              # 禁止访问的ip地址，可以为all
        # allow 172.168.33.44;             # 允许访问的ip地址，可以为all
    }
    
    # api 反向代理
    location ^~/api {
        # 重写路径：去掉 "/api" 前缀
        # rewrite ^/api/(.*)$ /$1 break;

        proxy_pass                   http://xxxx.com;

        # 获取代理时真实的请求
        proxy_set_header Host        $host;
        proxy_set_header X-Real-IP   $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # gpt 流式输出配置
        # proxy_http_version 1.1;  # 确保 HTTP/1.1 用于支持流式传输
        # proxy_cache off;         # 禁用代理缓存
        # proxy_buffering off;     # 禁止代理缓冲，保持流式传输
    }    

    # 仅对 /api/login 接口添加限流
    # burst参数允许短时间内的突发请求，
    # nodelay 参数表示超过burst限制的请求立即返回错误，而不是排队等待。
    location /api/login {
        limit_req zone=auth burst=30 nodelay;  # 限流配置
    }
    # 仅对 /api/register 接口添加限流
    location /api/register {
        limit_req zone=auth burst=30 nodelay;  
    }    

}