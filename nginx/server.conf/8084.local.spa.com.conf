# spa web
server {
	listen 8084;
	server_name localhost;
    charset utf-8;

    # 1. 开启 Gzip 压缩，减小传输体积
    gzip on;
    gzip_vary on;
    gzip_min_length 1024; # 小于此大小的文件不压缩
    gzip_proxied any;
    # 指定要压缩的 MIME 类型[reference:15]
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Nginx访问日志存放位置
    access_log  /Users/qinmao/Desktop/project/Front-End-Study/nginx/logs/local.spa.com/access.log custom;  
    error_log   /Users/qinmao/Desktop/project/Front-End-Study/nginx/logs/local.spa.com/error.log ;  

    # 静态资源缓存策略
    # 为带哈希值的静态资源设置长期缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 为 HTML 文件设置禁止缓存，确保用户总是获取最新版本
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # api 反向代理
    location ^~/api {
        # 重写路径：去掉 "/api" 前缀
        # rewrite ^/api/(.*)$ /$1 break;
        proxy_pass                   http://xxxx.com;

        # 获取代理时真实的请求
        proxy_set_header Host        $host;
        proxy_set_header X-Real-IP   $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # gpt 流式输出配置
        # proxy_http_version 1.1;  # 确保 HTTP/1.1 用于支持流式传输
        # proxy_cache off;         # 禁用代理缓存
        # proxy_buffering off;     # 禁止代理缓冲，保持流式传输
    }    

    # # 仅对 /api/login 接口添加限流
    # # burst参数允许短时间内的突发请求，
    # # nodelay 参数表示超过burst限制的请求立即返回错误，而不是排队等待。
    # location /api/login {
    #     limit_req zone=auth burst=30 nodelay;  # 限流配置
    # }
    # # 仅对 /api/register 接口添加限流
    # location /api/register {
    #     limit_req zone=auth burst=30 nodelay;  
    # }    

    # 解决 SPA 路由刷新404问题 (History 模式)
    location / {
        root /Users/qinmao/Desktop/project/Front-End-Study/nginx/html/spa/admin-web/dist;    # 网站根目录
        index index.html ;               # 默认首页文件
        try_files $uri $uri/ /index.html;# 按序访问，访问不到访问 /index.html
       
        # deny 172.168.22.11;              # 禁止访问的ip地址，可以为all
        # allow 172.168.33.44;             # 允许访问的ip地址，可以为all
    }
    
}