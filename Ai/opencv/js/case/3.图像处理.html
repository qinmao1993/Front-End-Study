<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <title>OpenCV.js 实战案例</title>
        <!-- 加载 OpenCV.js -->
        <!-- <script src="https://docs.opencv.org/master/opencv.js"></script> -->
        <script src="./static/opencv.js"></script>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 20px;
            }
            canvas {
                border: 1px solid #ccc;
                margin: 10px;
                max-width: 100%;
            }
            .section {
                margin-bottom: 40px;
            }
        </style>
    </head>
    <body>
        <h1>OpenCV.js 案例</h1>

        <div class="section">
            <h2>案例: 图像处理</h2>
            <input type="file" id="fileInput1" accept="image/*" />
            <br />
            <canvas id="canvasOutput1"></canvas>
        </div>

        <script>
    
            function initReadAndDisplayExample() {
                const fileInput = document.getElementById("fileInput1");
                const canvasOut = document.getElementById("canvasOutput1");

                fileInput.addEventListener("change", (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const url = URL.createObjectURL(file);
                    const img = new Image();
                    img.onload = () => {
                        // 从图像创建cv.Mat并显示
                        const rgbaMat = cv.imread(img);
                        console.log(
                            "图宽: " +
                                rgbaMat.cols +
                                "\n" +
                                "图高: " +
                                rgbaMat.rows +
                                "\n" +
                                "图像大小: " +
                                rgbaMat.size().width +
                                "*" +
                                rgbaMat.size().height +
                                "\n" +
                                "图像深度: " +
                                rgbaMat.depth() +
                                "\n" +
                                "图像通道数: " +
                                rgbaMat.channels() +
                                "\n" +
                                "图像类型: " +
                                rgbaMat.type() +
                                "\n",
                        );

                        // 转为灰度
                        // const grayMat = new cv.Mat();
                        // cv.cvtColor(rgbaMat, grayMat, cv.COLOR_RGBA2GRAY);

                        // 高斯模糊（可选，边缘更干净）
                        // cv.GaussianBlur(src, dst, ksize, sigmaX, sigmaY, borderType);
                        // const blurredMat = new cv.Mat();
                        // cv.GaussianBlur(
                        //     grayMat,
                        //     blurredMat,
                        //     new cv.Size(5, 5),
                        //     0,
                        // );

                        // // Canny 边缘检测
                        // const edgesMat = new cv.Mat();
                        // cv.Canny(blurredMat, edgesMat, 50, 150);

                        // // 在 ROI 上画矩形框（影响原图）
                        const rect = new cv.Rect(100, 100, 200, 200);
                        let roi = rgbaMat.roi(rect);
                        const color = new cv.Scalar(255, 0, 0, 255); // 红色
                        cv.rectangle(
                            roi,
                            new cv.Point(0, 0),
                            new cv.Point(roi.cols - 1, roi.rows - 1),
                            color,
                            2,
                        );


                        cv.imshow(canvasOut, rgbaMat);

                        // 释放内存
                        // grayMat.delete();
                        // blurredMat.delete();
                        // edgesMat.delete();
                        rgbaMat.delete(); 
                        roi.delete();
                        URL.revokeObjectURL(url); // 地址释放
                    };
                    img.src = url;
                });
            }

            cv.onRuntimeInitialized = function () {
                console.log("✅ OpenCV.js 已就绪，版本：");
                // console.log(cv.getBuildInformation && cv.getBuildInformation())
            };
        </script>
    </body>
</html>
