# 前后端完整配置示例
version: "3.8"

services:
    frontend: # 服务名称
        build:
            # 使用当前目录下的 Dockerfile 构建镜像
            context: ./dockerfiles/frontend # Dockerfile 所在目录
            dockerfile: Dockerfile # Dockerfile 文件名
        # 可以在构建时传入构建参数 (可选)
        # args:
        #   VITE_API_URL: http://your-api-server.com
        image: frontend-app:latest # 指定镜像名称，方便管理 (可选)
        container_name: frontend-container
        ports:
            - "80:80" # 端口映射
        restart: unless-stopped # 容器重启策略
        user: "node" # 非 root 用户运行
        volumes:
            # (可选) 如果你需要挂载配置文件或日志到宿主机
            #   - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - ./logs:/var/log/nginx
         # (可选) 健康检查
        healthcheck:
            test: ["CMD", "nginx", "-t"]
            interval: 30s
            timeout: 5s
            retries: 3
        networks:
            - app-network

    node-serve:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                NODE_ENV: production
        image: my-node-app:1.0.0
        container_name: node-app
        restart: unless-stopped
        user: "node" # 非 root 用户运行
        working_dir: /usr/src/app
        ports:
            - "3000:3000"
        volumes:
            - app_data:/usr/src/app/data
            - /etc/localtime:/etc/localtime:ro
        networks:
            - app-network
        healthcheck:
            test:
                ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s
        deploy:
            resources:
                limits:
                    cpus: "2.0"
                    memory: ${MEMORY_LIMIT}M
                reservations:
                    memory: 512M
        security_opt:
            - no-new-privileges:true
        tmpfs:
            - /tmp
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

    # 不推荐数据库部署在docker中，生产环境建议使用独立数据库服务,只做演示使用
    mysql:
        image: mysql:8.0
        container_name: mysql-db
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
            MYSQL_USER: ${DB_USER}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_DATABASE: ${DB_NAME}
        volumes: # 数据卷挂载
            - mysql_data:/var/lib/mysql
            - ./mysql/backups:/backups
        networks:
            - app-network
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "mysqladmin ping -h localhost -u ${DB_USER} -p${DB_PASSWORD}",
                ]
            interval: 30s
            timeout: 5s
            retries: 5
        deploy:
            resources:
                limits:
                    memory: 1G

    # Redis 缓存
    redis:
        image: redis:7-alpine
        container_name: redis-cache
        command: redis-server --save 60 1 --loglevel warning
        restart: unless-stopped
        volumes:
            - redis_data:/data
        networks:
            - app-network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
        deploy:
            resources:
                limits:
                    memory: 512M

volumes:
    # 定义数据卷
    app_data:
        driver_opts:
            type: none
            o: bind
            device: /data/node-app
            uid: 1000 # node 用户 UID
    mysql_data:
        driver_opts:
            type: none
            o: bind
            device: /data/mysql
            uid: 1000 # mysql 用户 UID
    redis_data:

networks:
    app-network:
        driver: bridge
        # ipam:
        #     config:
        #         - subnet: 10.1.0.0/24 # 指定子网范围
        #           gateway: 10.1.0.1
