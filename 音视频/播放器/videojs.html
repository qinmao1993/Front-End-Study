<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>videojs</title>
        <link
            href="https://vjs.zencdn.net/8.23.4/video-js.css"
            rel="stylesheet"
        />
        <style>
            .video-wrappepr{
                width: 100%;
                height: 600px;
                border: 1px solid red;
            }
        </style>
    </head>
    <body>
        <button id="play-btn">播放</button>
        <div class="video-wrappepr">
            <video id="my-video" class="video-js">
                Your browser does not support HTML5 video.
            </video>
        </div>

        <script src="https://vjs.zencdn.net/8.23.4/video.min.js"></script>
        <script>
            const player = videojs("my-video", {
                // h5 video 标签 标准属性
                controls: true, // 显示控制条
                autoplay: false, // 自动播放
                preload: "auto", // 预加载
                muted: true, // 静音
                // loop:false,
                // poster:'',   // 海报
                // src:'',
                // width:'',
                // height:'',

                // 播放器自有属性
                // https://videojs.org/guides/options/
                language: "zh-CN",
                liveui: true, // 实时视频样式，默认false
                // fluid: true, // 自适应播放器分辨率
                // aspectRatio:'8:6',  // 手动设置
                fill: true, // 填满容器
                // responsive: true, // 响应式 默认false
                playbackRates: [0.5, 1, 1.5, 2], // 播放速度
                plugins: [],
                // sources: [
                //     {
                //         src: "//vjs.zencdn.net/v/oceans.mp4",
                //         type: "video/mp4",
                //     },
                // ],
            });

            const palyBtn = document.querySelector("#play-btn");

            palyBtn.addEventListener("click", onPlayClick);

            function onPlayClick() {
                // player.src([
                //     { src: "video1.mp4", type: "video/mp4" },
                //     { src: "video2.mp4", type: "video/mp4" },
                // ]);
                player.src({
                    src: "//vjs.zencdn.net/v/oceans.mp4",
                    type: "video/mp4",
                });
                
                player.play();
            }

            // 播放控制
            // player.play();
            // player.pause();
            // player.paused(); // 检查是否暂停

            // 时间控制
            // player.currentTime(120); // 跳转到 2 分钟
            // player.currentTime(); // 获取当前时间
            // player.duration(); // 获取视频时长

            // 音量控制
            // player.volume(0.5); // 设置音量 (0-1)
            // player.muted(true); // 静音

            // 全屏
            // player.requestFullscreen();
            // player.exitFullscreen();
            // player.isFullscreen(); // 检查是否全屏

            // player.dispose()   // 清理播放器

            // 监听事件
            player.ready(function () {
                console.log("ready");
            });
            player.on("play", (e) => {
                console.log("播放开始");
            });

            player.on("pause", (e) => {
                console.log("播放暂停");
            });

            player.on("ended", (e) => {
                console.log("播放结束");
            });

            player.on("timeupdate", (e) => {
                console.log("时间更新:", player.currentTime());
            });

            player.on("volumechange", (e) => {
                console.log("音量改变:", player.volume());
            });

            // 一次性事件
            player.one("loadedmetadata", () => {
                console.log("元数据加载完成");
            });

            // 触发自定义事件
            // player.trigger("customEvent", { data: "custom" });
        </script>
    </body>
</html>
